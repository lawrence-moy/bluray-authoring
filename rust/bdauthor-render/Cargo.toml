[package]
name = "bdauthor-render"
version = "0.1.0"
edition = "2021"
description = "Rendu des boutons de menu (texte, PNG) pour bdauthor-core : bibliotheques `image` et `ab_glyph`"

[[bin]]
name = "bdauthor-build"
path = "src/bin/bdauthor-build.rs"

[dependencies]
bdauthor-core = { path = "../bdauthor-core" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
ab_glyph = "0.2"
